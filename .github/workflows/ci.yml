name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'examples/cyd-remote/platformio.ini') }}
      - run: pip install platformio
      - name: Library tests (PC)
        run: pio test -e native
      - name: Build the CYD remote
        run: pio run -d examples/cyd-remote
