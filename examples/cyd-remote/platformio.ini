; The touchscreen remote, for the ESP32 2.8" "Cheap Yellow Display", ESP32-32E variant (ILI9341 display, XPT2046
; touch; e.g. the ELEGOO / LCDwiki E32R28T). Build and flash from this folder:
;   pio run -t upload --upload-port <port>
; The original ESP32-2432S028R uses different display pins; see the README.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
lib_deps =
  ; This repo's library, from the checkout this example sits in. In your own project, use
  ; SmartLightBLE=https://github.com/caderoux/smartlight-ble-remote.git#v0.1.0
  SmartLightBLE=symlink://${PROJECT_DIR}/../..
  h2zero/NimBLE-Arduino@2.5.2
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  ; The main screen's title (default "Fan")
  '-DREMOTE_TITLE="Fan"'

  ; NimBLE: no central role. The peripheral role stays: the Smart Light app advertises CONNECTABLE, and the remote
  ; sends the same way.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1

  ; TFT_eSPI's setup as flags (the ESP32-32E CYD's pins)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
